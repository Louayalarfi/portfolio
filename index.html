<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lauai Alerfi · Systems Engineer</title>
  <meta name="description" content="Lauai Alerfi, systems engineer. Zoom into the machine: software on the monitor, FPGA and embedded boards on the desk, silicon inside the CPU." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2304060c'/%3E%3Crect x='8' y='8' width='16' height='16' rx='2' fill='none' stroke='%234fd8e0' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23c8893f'/%3E%3C/svg%3E" />
  <script>
    // Phones and browsers without WebGL2 get the classic page. ?3d=1 forces the 3D site.
    (function () {
      var p = new URLSearchParams(location.search);
      if (p.get('3d') === '1') return;
      var gl = null;
      try { gl = document.createElement('canvas').getContext('webgl2'); } catch (e) {}
      var phone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 700;
      if (!gl || phone) location.replace('/classic/?from=3d');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --substrate:#04060c; --cyan:#4fd8e0; --magenta:#e7609f; --amber:#f0a830;
      --violet:#9d84ef;   --lime:#a7d96a;  --copper:#c8893f;  --ink:#e9eefb;
      --muted:#7286a8;    --muted-2:#48597a; --line:rgba(120,150,200,.12);
      --display:'Chakra Petch',sans-serif;
      --mono:'IBM Plex Mono',monospace;
      --body:'Inter',sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #000; color: var(--ink); font-family: var(--body); }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    #warp {
      position: fixed; inset: 0; z-index: 4; pointer-events: none;
      opacity: 0; transition: opacity .25s; mix-blend-mode: screen;
      background: repeating-conic-gradient(from 0deg at 50% 50%,
        rgba(255,255,255,0) 0deg, rgba(150,220,255,.18) 1deg, rgba(255,255,255,0) 3deg);
    }
    #warp.on { opacity: 1; }

    .vignette {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse 115% 92% at 50% 46%, transparent 48%, rgba(1,2,6,.82) 100%);
    }
    .grain {
      position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: .045;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    .hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 13px clamp(12px,3vw,30px);
      background: linear-gradient(180deg, rgba(4,6,12,.85), transparent);
    }
    .hud-id { font-family: var(--display); font-weight: 700; letter-spacing: .14em; font-size: 15px; }
    .hud-id .dot { color: var(--copper); }
    .hud-id small { display: block; font-family: var(--mono); font-weight: 400; font-size: 10px; letter-spacing: .22em; color: var(--muted); margin-top: 2px; }
    .status { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--lime); }
    .status .led { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 10px var(--lime); animation: pulsek 2s infinite; }
    @keyframes pulsek { 50% { opacity: .45; } }
    .hud-spacer { flex: 1; }
    .util { display: flex; gap: 7px; flex-wrap: wrap; }
    .util button {
      font-family: var(--mono); font-size: 11px; letter-spacing: .07em;
      color: var(--muted); background: rgba(14,24,40,.6);
      border: 1px solid var(--line); padding: 7px 11px; border-radius: 5px;
      cursor: pointer; transition: .18s; text-transform: uppercase;
    }
    .util button:hover { color: var(--ink); border-color: var(--copper); background: rgba(200,137,63,.1); }
    .util button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .util a.classic {
      font-family: var(--mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
      color: var(--cyan); text-decoration: none; border: 1px solid rgba(79,216,224,.35);
      padding: 7px 11px; border-radius: 5px; transition: .18s;
    }
    .util a.classic:hover { background: rgba(79,216,224,.1); border-color: var(--cyan); }

    .hint {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      z-index: 15; font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
      color: var(--muted-2); text-transform: uppercase; text-align: center;
      pointer-events: none; transition: opacity .4s;
    }
    .hint b { color: var(--copper); }

    #boot {
      position: fixed; inset: 0; z-index: 60; background: var(--substrate);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); transition: opacity .7s, visibility .7s;
    }
    #boot.done { opacity: 0; visibility: hidden; }
    .boot-inner { width: min(560px, 90%); }
    .boot-brand {
      font-family: var(--display); font-weight: 700; letter-spacing: .18em;
      color: var(--copper); font-size: 13px; margin-bottom: 16px;
      display: flex; justify-content: space-between;
    }
    .boot-brand small { color: var(--muted-2); font-weight: 400; letter-spacing: .05em; }
    #bootlog { color: var(--muted); font-size: 13px; line-height: 1.9; white-space: pre-wrap; min-height: 200px; }
    #bootlog .ok { color: var(--lime); }
    #bootlog .cy { color: var(--cyan); }
    #bootlog b  { color: var(--ink); font-weight: 500; }
    .boot-bar { height: 5px; border: 1px solid #5a4326; margin: 18px 0 16px; overflow: hidden; border-radius: 2px; }
    .boot-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--copper), var(--cyan)); box-shadow: 0 0 14px var(--cyan); transition: width .25s; }
    .boot-enter {
      opacity: 0; transition: opacity .4s;
      font-family: var(--display); letter-spacing: .16em; font-weight: 600; font-size: 13px;
      display: flex; align-items: center; gap: 12px; cursor: pointer;
    }
    .boot-enter.show { opacity: 1; }
    .boot-enter .key {
      border: 1px solid var(--cyan); color: var(--cyan); padding: 4px 12px; border-radius: 4px;
      box-shadow: 0 0 18px rgba(79,216,224,.4); animation: pulsek 1.6s infinite;
    }

    #lightbox {
      position: fixed; inset: 0; z-index: 80; background: rgba(1,2,6,.94);
      display: none; align-items: center; justify-content: center;
      padding: 30px; cursor: zoom-out; backdrop-filter: blur(4px);
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 94vw; max-height: 90vh; border: 1px solid var(--copper); border-radius: 8px; }

    .mount-label {
      position: fixed; top: 0; left: 0; z-index: 18; pointer-events: none;
      transform: translate(-1000px, -1000px);
      padding: 7px 11px; border-radius: 6px; border: 1px solid var(--accent, var(--cyan));
      background: rgba(6,10,20,.82); backdrop-filter: blur(3px);
      margin-left: 14px; margin-top: -30px; opacity: 0; transition: opacity .15s;
      font-family: var(--mono); font-size: 11px; letter-spacing: .08em; white-space: nowrap;
    }
    .mount-label.on { opacity: 1; }
    .mount-label b { display: block; color: var(--accent, var(--cyan)); font-family: var(--display); font-size: 13px; letter-spacing: .06em; }
    .mount-label small { color: var(--muted); font-size: 10px; }

    #fallback {
      position: fixed; inset: 0; z-index: 70; display: none;
      align-items: center; justify-content: center; text-align: center;
      padding: 30px; font-family: var(--mono); color: var(--muted); font-size: 14px; line-height: 1.8;
    }

    @media (max-width: 640px) {
      .hint { font-size: 9.5px; bottom: 10px; }
      .status { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="warp"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <header class="hud">
    <div class="hud-id">LAUAI<span class="dot">.</span>ALERFI<small>SYSTEMS ENGINEER · GUELPH CA</small></div>
    <div class="status"><span class="led"></span><span id="status">RIG ONLINE</span></div>
    <div class="hud-spacer"></div>
    <div class="util">
      <button id="up" title="Esc">▲ Up</button>
      <button id="overview">⤢ Pull out</button>
      <button data-open="skills">Pinout</button>
      <button data-open="experience">Changelog</button>
      <button data-open="contact">I/O</button>
      <button id="quality" title="Cycle quality tier">Q</button>
      <button id="reboot">⟳ Reboot</button>
      <a class="classic" href="/classic/?from=3d">Classic site</a>
    </div>
  </header>

  <div class="hint" id="hint">drag to orbit · scroll to zoom · <b>click a component to dive through the wires</b></div>

  <div id="boot">
    <div class="boot-inner">
      <div class="boot-brand">LAUAI_ALERFI BIOS v2026.04 <small>SiP · charging capacitors</small></div>
      <div id="bootlog"></div>
      <div class="boot-bar"><i id="bootbar"></i></div>
      <div class="boot-enter" id="bootenter"><span class="key">ENTER</span> power on</div>
    </div>
  </div>

  <div id="lightbox"><img alt="" id="lbimg" /></div>
  <div id="fallback">3D engine could not load.<br>Check your connection and reload, or <a href="/classic/?from=3d" style="color:#4fd8e0">open the classic site</a>.</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
