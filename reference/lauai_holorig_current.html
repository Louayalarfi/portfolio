<style>
  :root{
    --substrate:#04060c;--cyan:#4fd8e0;--magenta:#e7609f;--amber:#f0a830;--violet:#9d84ef;--lime:#a7d96a;
    --copper:#c8893f;--ink:#e9eefb;--muted:#7286a8;--muted-2:#48597a;--line:rgba(120,150,200,.12);
    --display:'Chakra Petch',sans-serif;--mono:'IBM Plex Mono',monospace;--body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--body)}
  #scene{position:fixed;inset:0;z-index:0;display:block;touch-action:none}
  #warp{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .25s;mix-blend-mode:screen;
    background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,0) 0deg,rgba(150,220,255,.18) 1deg,rgba(255,255,255,0) 3deg)}
  #warp.on{opacity:1}
  .vignette{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse 115% 92% at 50% 46%,transparent 48%,rgba(1,2,6,.82) 100%)}
  .grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

  .hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:13px clamp(12px,3vw,30px);background:linear-gradient(180deg,rgba(4,6,12,.85),transparent)}
  .hud-id{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:15px}
  .hud-id .dot{color:var(--copper)}
  .hud-id small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.22em;color:var(--muted);margin-top:2px}
  .status{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--lime)}
  .status .led{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);animation:pulsek 2s infinite}
  @keyframes pulsek{50%{opacity:.45}}
  .hud-spacer{flex:1}
  .util{display:flex;gap:7px;flex-wrap:wrap}
  .util button{font-family:var(--mono);font-size:11px;letter-spacing:.07em;color:var(--muted);background:rgba(14,24,40,.6);border:1px solid var(--line);padding:7px 11px;border-radius:5px;cursor:pointer;transition:.18s;text-transform:uppercase}
  .util button:hover{color:var(--ink);border-color:var(--copper);background:rgba(200,137,63,.1)}
  .util button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

  .hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:15;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted-2);text-transform:uppercase;text-align:center;pointer-events:none;transition:opacity .4s}
  .hint b{color:var(--copper)}

  #boot{position:fixed;inset:0;z-index:60;background:var(--substrate);display:flex;align-items:center;justify-content:center;font-family:var(--mono);transition:opacity .7s,visibility .7s}
  #boot.done{opacity:0;visibility:hidden}
  .boot-inner{width:min(560px,90%)}
  .boot-brand{font-family:var(--display);font-weight:700;letter-spacing:.18em;color:var(--copper);font-size:13px;margin-bottom:16px;display:flex;justify-content:space-between}
  .boot-brand small{color:var(--muted-2);font-weight:400;letter-spacing:.05em}
  #bootlog{color:var(--muted);font-size:13px;line-height:1.9;white-space:pre-wrap;min-height:200px}
  #bootlog .ok{color:var(--lime)} #bootlog .cy{color:var(--cyan)} #bootlog b{color:var(--ink);font-weight:500}
  .boot-bar{height:5px;border:1px solid #5a4326;margin:18px 0 16px;overflow:hidden;border-radius:2px}
  .boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--copper),var(--cyan));box-shadow:0 0 14px var(--cyan);transition:width .25s}
  .boot-enter{opacity:0;transition:opacity .4s;font-family:var(--display);letter-spacing:.16em;font-weight:600;font-size:13px;display:flex;align-items:center;gap:12px;cursor:pointer}
  .boot-enter.show{opacity:1}
  .boot-enter .key{border:1px solid var(--cyan);color:var(--cyan);padding:4px 12px;border-radius:4px;box-shadow:0 0 18px rgba(79,216,224,.4);animation:pulsek 1.6s infinite}

  #lightbox{position:fixed;inset:0;z-index:80;background:rgba(1,2,6,.94);display:none;align-items:center;justify-content:center;padding:30px;cursor:zoom-out;backdrop-filter:blur(4px)}
  #lightbox.open{display:flex}
  #lightbox img{max-width:94vw;max-height:90vh;border:1px solid var(--copper);border-radius:8px}
  #fallback{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-family:var(--mono);color:var(--muted);font-size:14px;line-height:1.8}
  @media(max-width:640px){.hint{font-size:9.5px;bottom:10px}.status{display:none}}
</style>

/* ===================== 3D ===================== */
const COMP={};let started=false;
function boot3D(){
  if(!window.THREE){document.getElementById("fallback").style.display="flex";return;}
  const T=THREE;
  const canvas=document.getElementById("scene");
  const renderer=new T.WebGLRenderer({canvas,antialias:!MOBILE,powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(devicePixelRatio,MOBILE?1.6:2));
  renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
  const scene=new T.Scene();scene.background=new T.Color(0x04060c);scene.fog=new T.FogExp2(0x04060c,0.028);
  const camera=new T.PerspectiveCamera(46,innerWidth/innerHeight,0.05,300);const BASE_FOV=46;

  const home={target:new T.Vector3(0.2,2.0,0),r:11,theta:0.62,phi:1.0};
  const cam={target:home.target.clone(),r:home.r,theta:home.theta,phi:home.phi};
  let mode="orbit",orbitAnim=null,dive=null,focus=null;

  /* env reflections */
  try{
    const pm=new T.PMREMGenerator(renderer);const es=new T.Scene();
    es.add(new T.Mesh(new T.BoxGeometry(50,40,50),new T.MeshBasicMaterial({color:0x0e131c,side:T.BackSide})));
    const lite=(c,w,h,x,y,z)=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:c}));m.position.set(x,y,z);m.lookAt(0,4,0);es.add(m);};
    lite(0xffffff,18,7,0,18,-8);lite(0x9fd0ff,12,14,-18,9,5);lite(0xffd9a0,9,12,18,8,4);lite(0x4fd8e0,4,4,-5,6,9);lite(0xe7609f,4,4,5,5,9);
    scene.environment=pm.fromScene(es,0.04).texture;pm.dispose();
  }catch(e){console.warn("env skipped",e);}

  /* lights */
  scene.add(new T.HemisphereLight(0x8ea7d8,0x0a0e16,0.42));
  const key=new T.DirectionalLight(0xdfe8ff,1.5);key.position.set(7,12,8);key.castShadow=true;
  key.shadow.mapSize.set(MOBILE?1024:2048,MOBILE?1024:2048);key.shadow.camera.near=1;key.shadow.camera.far=44;
  key.shadow.camera.left=-12;key.shadow.camera.right=12;key.shadow.camera.top=13;key.shadow.camera.bottom=-2;
  key.shadow.bias=-0.0004;key.shadow.normalBias=0.02;scene.add(key);
  const fill=new T.DirectionalLight(0xc8893f,0.5);fill.position.set(-9,5,-7);scene.add(fill);
  const pCyan=new T.PointLight(0x4fd8e0,6,8,2);pCyan.position.set(-2.6,2.95,0.5);scene.add(pCyan);
  const pMag=new T.PointLight(0xe7609f,5,8,2);pMag.position.set(-2.35,1.55,0.7);scene.add(pMag);

  /* glow sprite */
  const haloCanvas=document.createElement("canvas");haloCanvas.width=haloCanvas.height=128;
  {const g=haloCanvas.getContext("2d");const rg=g.createRadialGradient(64,64,0,64,64,64);rg.addColorStop(0,"rgba(255,255,255,1)");rg.addColorStop(.25,"rgba(255,255,255,.6)");rg.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=rg;g.fillRect(0,0,128,128);}
  const haloTex=new T.CanvasTexture(haloCanvas);
  function halo(hex,size,x,y,z,parent){const s=new T.Sprite(new T.SpriteMaterial({map:haloTex,color:hex,transparent:true,blending:T.AdditiveBlending,depthWrite:false,opacity:.9}));s.scale.set(size,size,1);s.position.set(x,y,z);(parent||scene).add(s);return s;}

  /* textures */
  function pcbTex(base,trace){const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");
    x.fillStyle=base;x.fillRect(0,0,512,512);x.lineCap="round";x.strokeStyle=trace;x.lineWidth=2;x.globalAlpha=.45;
    for(let i=0;i<70;i++){let px=Math.random()*512,py=Math.random()*512;x.beginPath();x.moveTo(px,py);for(let j=0;j<4;j++){if(Math.random()<.5)px+=Math.random()*90-45;else py+=Math.random()*90-45;x.lineTo(px,py);}x.stroke();}
    x.globalAlpha=.7;x.fillStyle=trace;for(let i=0;i<140;i++){x.beginPath();x.arc(Math.random()*512,Math.random()*512,2.4,0,7);x.fill();}
    const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.encoding=T.sRGBEncoding;return t;}
  const pcbGreen=pcbTex("#0c2e22","#3fcf8e"),pcbBlue=pcbTex("#0d2038","#3f8fd0"),pcbDark=pcbTex("#08130e","#2fae78");

  const std=(o)=>new T.MeshStandardMaterial(o);
  const matFloor=std({color:0x070a11,metalness:0.3,roughness:0.7,envMapIntensity:0.7});
  const matCase=std({color:0x12161e,metalness:0.92,roughness:0.34,envMapIntensity:1.1});
  const matEdge=std({color:0x2a2f38,metalness:1,roughness:0.22,envMapIntensity:1.2});
  const matInner=std({color:0x0a0d14,metalness:0.6,roughness:0.55,envMapIntensity:0.7});
  const matGlass=new T.MeshPhysicalMaterial({color:0xbfe6f0,metalness:0,roughness:0.05,transparent:true,opacity:0.15,clearcoat:1,clearcoatRoughness:0.04,envMapIntensity:1.4,side:T.DoubleSide});
  const matMobo=std({map:pcbGreen,color:0x4a8f6f,metalness:0.15,roughness:0.62,envMapIntensity:0.6});
  const matHS=std({color:0xaab4c4,metalness:1,roughness:0.28,envMapIntensity:1.3});
  const matAlu=std({color:0x9aa3b0,metalness:1,roughness:0.32,envMapIntensity:1.2});
  const matPlastic=std({color:0x0c0f15,metalness:0.25,roughness:0.45,envMapIntensity:0.8});
  const matCopper=std({color:0xc8893f,metalness:1,roughness:0.3,envMapIntensity:1.3});
  const matGold=std({color:0xd9b25a,metalness:1,roughness:0.35,envMapIntensity:1.2});
  const matDIMM=std({color:0x14181f,metalness:0.4,roughness:0.4,envMapIntensity:1});
  const glowMat=(hex)=>std({color:0x0a0c12,emissive:hex,emissiveIntensity:1.6,metalness:0.4,roughness:0.4,envMapIntensity:0.5});

  function box(w,h,d,mat,x,y,z,parent,shadow=true){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);if(shadow){m.castShadow=true;m.receiveShadow=true;}(parent||scene).add(m);return m;}
  function cyl(rt,rb,h,seg,mat,x,y,z,parent){const m=new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}
  function contact(x,z,sx,sz){const cc=document.createElement("canvas");cc.width=cc.height=128;const g=cc.getContext("2d");const rg=g.createRadialGradient(64,64,4,64,64,62);rg.addColorStop(0,"rgba(0,0,0,.6)");rg.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=rg;g.fillRect(0,0,128,128);const m=new T.Mesh(new T.PlaneGeometry(sx,sz),new T.MeshBasicMaterial({map:new T.CanvasTexture(cc),transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set(x,0.012,z);scene.add(m);}

          const frm=new T.Mesh(new T.PlaneGeometry(cw+0.04,cw*0.52+0.04),new T.MeshBasicMaterial({color:col,transparent:true,opacity:0.25,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide}));frm.position.set(0,ip.position.y,-0.01);g.add(frm);},undefined,()=>{ip.visible=false;});}
      g.userData.spin=Math.random()*6;holoGroup.add(g);});
  }

  /* info holo (skills/exp/contact) */
  function infoCanvas(kind){const c=document.createElement("canvas");c.width=900;c.height=760;const g=c.getContext("2d");
    g.fillStyle="rgba(8,14,26,.9)";rrect(g,6,6,888,748,20);g.fill();g.lineWidth=2.5;g.strokeStyle="#c8893f";rrect(g,6,6,888,748,20);g.stroke();
    g.fillStyle="#c8893f";rrect(g,6,6,888,56,20);g.fill();g.fillStyle="#06101c";g.font="700 24px 'IBM Plex Mono',monospace";
    g.fillText(kind==="skills"?"PINOUT  ·  CAPABILITY MAP":kind==="experience"?"CHANGELOG  ·  COMMIT HISTORY":"I/O PORTS  ·  CONNECT",30,44);
    if(kind==="skills"){let y=110;SKILLS.forEach(([grp,arr])=>{g.fillStyle="#4fd8e0";g.font="600 20px 'IBM Plex Mono',monospace";g.fillText(grp.toUpperCase(),30,y);y+=14;g.font="400 17px 'IBM Plex Mono',monospace";let tx=30;y+=22;arr.forEach(s=>{const w=g.measureText(s).width+22;if(tx+w>860){tx=30;y+=38;}g.fillStyle="rgba(255,255,255,.05)";rrect(g,tx,y-22,w,30,7);g.fill();g.strokeStyle="rgba(120,150,200,.25)";g.lineWidth=1;rrect(g,tx,y-22,w,30,7);g.stroke();g.fillStyle="#b8c4dc";g.fillText(s,tx+11,y);tx+=w+8;});y+=54;});}
    else if(kind==="experience"){let y=104;EXPERIENCE.forEach(r=>{g.fillStyle="#c8893f";g.font="400 15px 'IBM Plex Mono',monospace";g.fillText(r[0],30,y);g.fillStyle="#e9eefb";g.font="700 23px 'Chakra Petch',sans-serif";g.fillText(r[1],30,y+28);g.fillStyle="#7286a8";g.font="400 16px 'IBM Plex Mono',monospace";g.fillText(r[2],30,y+52);g.fillStyle="#9fb0cc";g.font="400 16px Inter,sans-serif";const ny=wrap(g,r[3],30,y+78,840,23,3);y=ny+22;});}
    else{let y=130;CONTACT.forEach(p=>{g.fillStyle="rgba(255,255,255,.04)";rrect(g,30,y-34,840,64,12);g.fill();g.strokeStyle="rgba(212,162,86,.4)";g.lineWidth=1.5;rrect(g,30,y-34,840,64,12);g.stroke();g.fillStyle="#d4a256";g.font="600 16px 'IBM Plex Mono',monospace";g.fillText(p[0],52,y+4);g.fillStyle="#e9eefb";g.font="500 24px Inter,sans-serif";g.fillText(p[1],200,y+6);y+=88;});g.fillStyle="#7286a8";g.font="400 15px 'IBM Plex Mono',monospace";wrap(g,CERTS,34,y+6,840,22,3);}
    const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=4;return t;}
  function buildInfoHolo(kind){clearHolos();const w=4.2,h=w*760/900;const center=new T.Vector3(0.5,2.7,1.4);
    const g=new T.Group();g.position.copy(center);
    const panel=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:infoCanvas(kind),transparent:true,depthWrite:false,side:T.DoubleSide}));g.add(panel);
    const fr=new T.Mesh(new T.PlaneGeometry(w+0.08,h+0.08),new T.MeshBasicMaterial({color:0xc8893f,transparent:true,opacity:0.16,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide}));fr.position.z=-0.01;g.add(fr);
    halo(0xc8893f,0.6,0,h/2,0.02,g);halo(0xc8893f,0.6,0,-h/2,0.02,g);
    holoGroup.add(g);
    orbitTo({target:new T.Vector3(0.5,2.4,0.2),r:6.2,theta:0.1,phi:1.02});}

  /* floating intro hologram (home) */
  const introG=new T.Group();scene.add(introG);
  {const c=document.createElement("canvas");c.width=1400;c.height=760;const g=c.getContext("2d");
   function draw(){g.clearRect(0,0,1400,760);g.fillStyle="rgba(7,13,24,.55)";rrect(g,8,8,1384,744,26);g.fill();g.lineWidth=2.5;g.strokeStyle="rgba(79,216,224,.55)";rrect(g,8,8,1384,744,26);g.stroke();
     g.fillStyle="#c8893f";g.font="600 30px 'IBM Plex Mono',monospace";g.fillText("// who_am_i.init()",60,90);
     g.fillStyle="#e9eefb";g.font="700 150px 'Chakra Petch',sans-serif";g.fillText("LAUAI ALERFI",56,236);
     g.fillStyle="#4fd8e0";g.font="500 40px 'IBM Plex Mono',monospace";g.fillText("SYSTEMS ENGINEER  ·  UNIVERSITY OF GUELPH  ·  APR 2026",60,300);
     g.fillStyle="#aeb9d2";g.font="400 33px Inter,sans-serif";
     wrap(g,"One engineer across every layer of the stack — from transistors hand-placed in a die to FPGA fabric, embedded firmware, and the software that runs on top. Originally from Damascus, now building in Canada.",60,372,1280,46,3);
     let x=60;STATS.forEach(s=>{g.fillStyle="rgba(79,216,224,.08)";rrect(g,x,560,300,150,16);g.fill();g.strokeStyle="rgba(79,216,224,.4)";g.lineWidth=1.5;rrect(g,x,560,300,150,16);g.stroke();
       g.fillStyle="#4fd8e0";g.font="700 64px 'Chakra Petch',sans-serif";g.fillText(s[0],x+28,640);g.fillStyle="#7286a8";g.font="400 24px 'IBM Plex Mono',monospace";g.fillText(s[1],x+30,684);x+=330;});
     introTex.needsUpdate=true;}
   const introTex=new T.CanvasTexture(c);introTex.encoding=T.sRGBEncoding;introTex.anisotropy=4;
   window.__drawIntro=draw;
   const w=6.4,h=w*760/1400;
   const panel=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:introTex,transparent:true,depthWrite:false,side:T.DoubleSide}));introG.add(panel);
   const fr=new T.Mesh(new T.PlaneGeometry(w+0.1,h+0.1),new T.MeshBasicMaterial({color:0x4fd8e0,transparent:true,opacity:0.12,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide}));fr.position.z=-0.01;introG.add(fr);
   halo(0x4fd8e0,0.8,-w/2,h/2,0.02,introG);halo(0x4fd8e0,0.8,w/2,-h/2,0.02,introG);
   introG.position.set(0.4,5.0,0.8);draw();}

  /* ---------- CAMERA ---------- */
  function applyOrbit(){const sp=Math.sin(cam.phi),cp=Math.cos(cam.phi),st=Math.sin(cam.theta),ct=Math.cos(cam.theta);
    camera.position.set(cam.target.x+cam.r*sp*st,cam.target.y+cam.r*cp,cam.target.z+cam.r*sp*ct);camera.lookAt(cam.target);}
  function easeIO(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  function orbitTo(v){orbitAnim={t:0,dur:reduce?0.001:1.0,from:{target:cam.target.clone(),r:cam.r,theta:cam.theta,phi:cam.phi},to:{target:v.target.clone(),r:v.r,theta:v.theta,phi:v.phi}};}
  function deriveOrbit(center,pos){const d=new T.Vector3().subVectors(pos,center);const r=Math.max(1.4,d.length());cam.target.copy(center);cam.r=r;cam.phi=Math.acos(Math.max(-1,Math.min(1,d.y/r)));cam.theta=Math.atan2(d.x,d.z);}

  const warpEl=document.getElementById("warp"),hintEl=document.getElementById("hint");
  window.goOverview=function(){mode="orbit";dive=null;focus=null;clearHolos();monMode="home";drawMon();introG.visible=true;
    warpEl.classList.remove("on");if(camera.fov!==BASE_FOV){camera.fov=BASE_FOV;camera.updateProjectionMatrix();}orbitTo(home);};
  document.getElementById("overview").addEventListener("click",()=>goOverview());
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{focus=b.dataset.open;mode="orbit";dive=null;introG.visible=false;hintEl.style.opacity=0;buildInfoHolo(b.dataset.open);}));

  window.diveTo=function(region){const c=COMP[region];if(!c||!c.dive)return;mode="dive";orbitAnim=null;focus=region;clearHolos();introG.visible=false;
    dive={region,curve:c.dive,t:0,dur:reduce?0.001:2.0,fromPos:camera.position.clone(),tunnel:c.tunnel,tmat:c.tmat,center:c.center};
    c.tunnel.visible=true;warpEl.classList.add("on");hintEl.style.opacity=0;if(reduce)endDive();};
  function endDive(){const c=COMP[dive.region],region=dive.region;c.tunnel.visible=false;warpEl.classList.remove("on");
    camera.fov=BASE_FOV;camera.updateProjectionMatrix();mode="orbit";
    if(region==="software"){deriveOrbit(screenWorld,camera.position);orbitTo({target:screenWorld.clone(),r:2.7,theta:cam.theta,phi:cam.phi});monMode="software";drawMon();}
    else{deriveOrbit(c.center,camera.position);const n=PROJECTS[region].length;orbitTo({target:c.center.clone(),r:3.0+n*0.4,theta:cam.theta,phi:Math.min(1.25,cam.phi)});buildProjectHolos(region);}
    dive=null;}
  function updateDive(dt){dive.t=Math.min(1,dive.t+dt/dive.dur);const t=dive.t,pre=0.15,curve=dive.curve;const look=new T.Vector3();
    if(t<pre){const u=t/pre;camera.position.lerpVectors(dive.fromPos,curve.getPointAt(0),easeIO(u));look.copy(curve.getPointAt(0.03));}
    else{const u=(t-pre)/(1-pre);const e=easeIO(u);camera.position.copy(curve.getPointAt(e));look.copy(curve.getPointAt(Math.min(1,e+0.05)));}
    camera.lookAt(look);const warp=Math.sin(t*Math.PI);camera.fov=BASE_FOV+warp*20;camera.updateProjectionMatrix();camera.rotation.z+=Math.sin(t*46)*0.004*warp;
    dive.tmat.uniforms.uTime.value+=dt;if(t>=1)endDive();}

  /* ---------- INTERACTION ---------- */
  const ray=new T.Raycaster(),ndc=new T.Vector2();let CLICK=[];
  function buildClick(){CLICK=[];for(const k in COMP){COMP[k].group.traverse(o=>{if(o.isMesh){o.userData.region=k;CLICK.push(o);}});}}
  function pickFrom(x,y,list){ndc.x=(x/innerWidth)*2-1;ndc.y=-(y/innerHeight)*2+1;ray.setFromCamera(ndc,camera);return ray.intersectObjects(list,false);}
  let dragging=false,moved=0,lx=0,ly=0,pinch=0;
  canvas.addEventListener("pointerdown",e=>{if(mode!=="orbit")return;dragging=true;moved=0;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener("pointermove",e=>{if(dragging){const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);lx=e.clientX;ly=e.clientY;cam.theta-=dx*0.005;cam.phi=Math.max(0.2,Math.min(1.5,cam.phi-dy*0.005));orbitAnim=null;}
    else if(mode==="orbit"){const hHolo=HOLO_PICK.length?pickFrom(e.clientX,e.clientY,HOLO_PICK):[];const hComp=hHolo.length?[]:pickFrom(e.clientX,e.clientY,CLICK);canvas.style.cursor=(hHolo.length||hComp.length)?"pointer":"grab";}});
  canvas.addEventListener("pointerup",e=>{if(!dragging)return;dragging=false;if(moved>6||mode!=="orbit")return;
    const hHolo=HOLO_PICK.length?pickFrom(e.clientX,e.clientY,HOLO_PICK):[];
    if(hHolo.length){const u=hHolo[0].object.userData;const p=PROJECTS[u.region][u.idx];if(p.links.length)window.open(IMG+encodeURIComponent(p.links[0].u),"_blank");else if(p.imgs.length)openImg(IMG+encodeURIComponent(p.imgs[0]));return;}
    const hComp=pickFrom(e.clientX,e.clientY,CLICK);if(hComp.length)diveTo(hComp[0].object.userData.region);});
  canvas.addEventListener("wheel",e=>{if(mode!=="orbit")return;e.preventDefault();cam.r=Math.max(2.0,Math.min(20,cam.r+e.deltaY*0.01));orbitAnim=null;},{passive:false});
  canvas.addEventListener("touchstart",e=>{if(e.touches.length===2)pinch=d2(e.touches);},{passive:true});
  canvas.addEventListener("touchmove",e=>{if(e.touches.length===2&&mode==="orbit"){const d=d2(e.touches);cam.r=Math.max(2,Math.min(20,cam.r+(pinch-d)*0.01));pinch=d;orbitAnim=null;}},{passive:true});
  function d2(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}

  function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
  addEventListener("resize",resize);resize();buildClick();applyOrbit();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(window.__drawIntro)__drawIntro();drawMon();if(focus&&PROJECTS[focus])buildProjectHolos(focus);});

  /* ---------- LOOP ---------- */
  const camPos=new T.Vector3();let tms=performance.now();
  function loop(now){const dt=Math.min(0.05,(now-tms)/1000)||0;tms=now;const time=now*0.001;
    if(mode==="dive"&&dive)updateDive(dt);
    else{if(orbitAnim){orbitAnim.t=Math.min(1,orbitAnim.t+dt/orbitAnim.dur);const e=easeIO(orbitAnim.t);
        cam.target.lerpVectors(orbitAnim.from.target,orbitAnim.to.target,e);cam.r=orbitAnim.from.r+(orbitAnim.to.r-orbitAnim.from.r)*e;
        cam.theta=orbitAnim.from.theta+(orbitAnim.to.theta-orbitAnim.from.theta)*e;cam.phi=orbitAnim.from.phi+(orbitAnim.to.phi-orbitAnim.from.phi)*e;if(orbitAnim.t>=1)orbitAnim=null;}
      applyOrbit();}
    // electric cables
    cables.forEach((cb,i)=>{cb.mat.emissiveIntensity=0.5+0.35*Math.sin(time*3+i)+0.15*Math.sin(time*17+i*5);
      cb.sparks.forEach((s,k)=>{const tt=((time*0.5)+i*0.3+k/cb.sparks.length)%1;s.position.copy(cb.curve.getPoint(tt));const fl=0.18+0.12*Math.abs(Math.sin(time*20+k*3+i));s.scale.set(fl,fl,1);});});
    pCyan.intensity=5.5+1.2*Math.sin(time*1.5);pMag.intensity=4.8+1.0*Math.cos(time*1.2);
    if(COMP.vlsi.fan)COMP.vlsi.fan.rotation.y=time*5;
    if(COMP.fpga.fans)COMP.fpga.fans.forEach((f,i)=>f.rotation.y=time*(i?-6:6));
    if(COMP.control.lev){COMP.control.lev.position.y=0.62+Math.sin(time*1.7)*0.07;COMP.control.lev.rotation.y=time*0.7;COMP.control.lev.rotation.x=time*0.4;}
    // billboards + float
    camera.getWorldPosition(camPos);
    holoGroup.children.forEach(g=>{g.quaternion.copy(camera.quaternion);g.position.y+=Math.sin(time*1.5+g.userData.spin)*0.0008;});
    if(introG.visible){introG.quaternion.copy(camera.quaternion);introG.position.y=5.0+Math.sin(time*0.8)*0.08;}
    renderer.render(scene,camera);requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
}

/* ===================== BOOT ===================== */
(function(){
  const log=document.getElementById("bootlog"),bar=document.getElementById("bootbar"),enter=document.getElementById("bootenter"),boot=document.getElementById("boot");
  const lines=["POST ............................ <span class='ok'>OK</span>",
    "charge capacitors · 12V rail ...... <span class='ok'>stable</span>",
    "energize: <b>CPU / VLSI</b> .......... <span class='cy'>live</span>",
    "energize: <b>GPU / FPGA</b> .......... <span class='cy'>live</span>",
    "energize: <b>DEV BOARDS</b> .......... <span class='cy'>live</span>",
    "bake reflections · env map ........ <span class='ok'>done</span>",
    "ionize cable plasma ............... <span class='cy'>flowing</span>",
    "project holograms ................. <span class='ok'>ready</span>"];
  let done=false;
  function start3D(){if(started)return;started=true;try{boot3D();}catch(e){console.error(e);document.getElementById("fallback").style.display="flex";}}
  function finish(){if(done)return;done=true;boot.classList.add("done");start3D();}
  if(reduce){log.innerHTML=lines.join("\n");bar.style.width="100%";enter.classList.add("show");}
  else{let i=0;(function n(){if(i<lines.length){log.innerHTML+=(i?"\n":"")+lines[i];bar.style.width=((i+1)/lines.length*100)+"%";i++;setTimeout(n,150+Math.random()*110);}else setTimeout(()=>enter.classList.add("show"),250);})();}
  enter.addEventListener("click",finish);boot.addEventListener("click",()=>{if(enter.classList.contains("show"))finish();});
  document.addEventListener("keydown",e=>{if(!done&&(e.key==="Enter"||e.key===" "))finish();});
  document.getElementById("reboot").addEventListener("click",()=>{if(window.goOverview)goOverview();});
})();
